class Box { constructor(){this.min=new Vec(Infinity,Infinity,Infinity);this.max=new Vec(-Infinity,-Infinity,-Infinity)} expandByPoint(p){for(const k of ['x','y','z']){this.min[k]=Math.min(this.min[k],p[k]);this.max[k]=Math.max(this.max[k],p[k])}return this} getCenter(v){return v.set((this.min.x+this.max.x)/2,(this.min.y+this.max.y)/2,(this.min.z+this.max.z)/2)}getSize(v){return v.set(this.max.x-this.min.x,this.max.y-this.min.y,this.max.z-this.min.z)}expandByScalar(){return this} }
